<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Eine Lernseite: links ein gelber Zettel mit einer Karteikartenfrage, rechts eine Multiple-Choice-Frage mit hervorgehobener richtiger Antwort">
  <title>Flashcards fuer die Berufsschule</title>

  <!-- Farbwerte woertlich aus docs/superpowers/specs/2026-08-27-flashcards-design.md,
       Abschnitt 6. Bewusst ohne Filter (Weichzeichner, Schlagschatten): Die
       Tiefe entsteht aus dem gestapelten Papier, nicht aus einem Effekt, den
       ein Sanitizer wegwerfen koennte. -->
  <defs>
    <radialGradient id="tafel" cx="0.5" cy="0" r="0.95">
      <stop offset="0" stop-color="#2a3138"/>
      <stop offset="0.7" stop-color="#16191d"/>
      <stop offset="1" stop-color="#16191d"/>
    </radialGradient>
    <linearGradient id="zettel" x1="0" y1="0" x2="0.38" y2="1">
      <stop offset="0" stop-color="#ffe57a"/>
      <stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
    <pattern id="raster" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0v22" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <clipPath id="tafelform">
      <rect x="0" y="0" width="1200" height="420" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tafelform)">
    <rect x="0" y="0" width="1200" height="420" fill="url(#tafel)"/>
    <rect x="0" y="0" width="1200" height="420" fill="url(#raster)"/>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <!-- Fortschritt, wie auf der echten Lernseite oben links -->
    <text x="40" y="48" fill="#7b8996" font-size="13" letter-spacing="1.4">FRAGE 3 VON 12</text>

    <!-- Der Zettelstapel: zwei angedeutete Lagen, darauf der Zettel -->
    <rect x="310" y="90" width="240" height="240" rx="3" fill="#e9bf3a"
          transform="rotate(-8.5 430 210)"/>
    <rect x="310" y="90" width="240" height="240" rx="3" fill="#f0cd52"
          transform="rotate(-6 430 210)"/>
    <g transform="rotate(-3.5 430 210)">
      <rect x="310" y="90" width="240" height="240" rx="3" fill="url(#zettel)"/>
      <text x="332" y="150" fill="#2b2410" font-size="20" font-weight="600">Was ist ein</text>
      <text x="332" y="176" fill="#2b2410" font-size="20" font-weight="600">Akkumulator?</text>
      <text x="332" y="308" fill="#2b2410" fill-opacity="0.55" font-size="10" letter-spacing="0.5">ZUM UMDREHEN KLICKEN</text>
    </g>

    <!-- Die Multiple-Choice-Karte, aufgeloest -->
    <g transform="rotate(2 840 210)">
      <rect x="670" y="90" width="340" height="240" rx="8" fill="#232a31" stroke="#333d47"/>
      <text x="694" y="126" fill="#e8edf2" font-size="17" font-weight="600">Wofür steht die Abkürzung LED?</text>

      <rect x="694" y="146" width="292" height="36" rx="6" fill="#2c343c"/>
      <rect x="706" y="155" width="18" height="18" rx="4" fill="#3a444e"/>
      <text x="715" y="168" fill="#aab6c2" font-size="11" text-anchor="middle">A</text>
      <text x="734" y="169" fill="#e8edf2" font-size="14">Low Energy Display</text>

      <rect x="694" y="190" width="292" height="36" rx="6" fill="#264638" stroke="#34c759" stroke-opacity="0.45"/>
      <rect x="706" y="199" width="18" height="18" rx="4" fill="#34c759" fill-opacity="0.35"/>
      <text x="715" y="212" fill="#d6ffe4" font-size="11" text-anchor="middle">B</text>
      <text x="734" y="213" fill="#7ee2a0" font-size="14">Lichtemittierende Diode</text>
      <text x="966" y="213" fill="#7ee2a0" font-size="14" text-anchor="middle">✓</text>

      <rect x="694" y="234" width="292" height="36" rx="6" fill="#2c343c"/>
      <rect x="706" y="243" width="18" height="18" rx="4" fill="#3a444e"/>
      <text x="715" y="256" fill="#aab6c2" font-size="11" text-anchor="middle">C</text>
      <text x="734" y="257" fill="#e8edf2" font-size="14">Linearer Elektro-Draht</text>

      <rect x="694" y="278" width="292" height="36" rx="6" fill="#2c343c"/>
      <rect x="706" y="287" width="18" height="18" rx="4" fill="#3a444e"/>
      <text x="715" y="300" fill="#aab6c2" font-size="11" text-anchor="middle">D</text>
      <text x="734" y="301" fill="#e8edf2" font-size="14">Ladungs-Endstufen-Detektor</text>
    </g>
  </g>
</svg>
