; priority ordnet nur die Reihenfolge der Start- und Stopp-AUFRUFE.
; supervisord wartet dabei NICHT auf Bereitschaft: postgres wird vor db-init
; und db-init vor app angestossen, aber alle drei laufen danach parallel
; weiter. Verlassen darf sich deshalb niemand darauf - jedes Programm wartet
; selbst auf das, was es braucht (db-init.sh auf pg_isready, app-start.sh auf
; eine echte Datenbankverbindung mit den Zugangsdaten der Anwendung).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /data/pgdata
user=postgres
autorestart=true
priority=10
; Fast Shutdown (SIGINT) statt Smart Shutdown (SIGTERM, supervisords
; Standard): rollt laufende Transaktionen zurueck, checkpointet aber sauber
; und dauert dabei kurz. stopwaitsecs grosszuegig, damit dieser Checkpoint
; nicht per SIGKILL unterbrochen wird - Postgres wuerde sonst bei jedem
; Deployment per Crash-Recovery neu hochfahren statt sauber herunterzufahren.
; Coolifys Stop-Grace-Period muss dafuer entsprechend erhoeht werden.
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:db-init]
; Stellt bei jedem Start sicher, dass Rolle und Datenbank existieren, und
; gleicht das Passwort der Rolle ab. Laeuft als postgres, nicht als app: app
; ist unprivilegiert und kann kein su postgres mehr (siehe db-init.sh).
; Einmaliger Schritt, kein Dauerprozess - startsecs=0, damit ein schneller,
; sauberer Exit (Code 0) nicht faelschlich als fehlgeschlagener Start gilt.
; Scheitert dieser Schritt, bleibt das nicht folgenlos: app-start.sh bekommt
; dann keine Verbindung und bricht mit Klartext ab.
command=/app/docker/db-init.sh
user=postgres
autorestart=false
startsecs=0
startretries=1
priority=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:app]
; Einziger von aussen erreichbarer Prozess (verarbeitet Markdown und
; Nutzereingaben) - laeuft deshalb unprivilegiert als app, nicht als root.
command=/app/docker/app-start.sh
directory=/app
user=app
autorestart=true
priority=20
stopwaitsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
