[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /data/pgdata
user=postgres
autorestart=true
priority=10
; Fast Shutdown (SIGINT) statt Smart Shutdown (SIGTERM, supervisords
; Standard): rollt laufende Transaktionen zurueck, checkpointet aber sauber
; und dauert dabei kurz. stopwaitsecs grosszuegig, damit dieser Checkpoint
; nicht per SIGKILL unterbrochen wird - Postgres wuerde sonst bei jedem
; Deployment per Crash-Recovery neu hochfahren statt sauber herunterzufahren.
; Coolifys Stop-Grace-Period muss dafuer entsprechend erhoeht werden.
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:db-init]
; Legt beim Erststart Rolle und Datenbank an und synchronisiert danach bei
; jedem Start das Passwort. Laeuft als postgres, nicht als app: app ist seit
; der Aufteilung unprivilegiert und kann kein su postgres mehr (siehe
; app-start.sh/db-init.sh). Einmaliger Schritt, kein Dauerprozess -
; startsecs=0, damit ein schneller, sauberer Exit (Code 0) nicht faelschlich
; als fehlgeschlagener Start gewertet wird.
command=/app/docker/db-init.sh
user=postgres
autorestart=false
startsecs=0
startretries=1
priority=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:app]
; Einziger von aussen erreichbarer Prozess (verarbeitet Markdown und
; Nutzereingaben) - laeuft deshalb unprivilegiert als app, nicht als root.
command=/app/docker/app-start.sh
directory=/app
user=app
autorestart=true
priority=20
stopwaitsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[eventlistener:failfast]
; Siehe docker/failfast-listener.py: beendet den Container, wenn der
; App-Prozess dauerhaft (FATAL) gescheitert ist, statt ihn scheintot
; weiterlaufen zu lassen. Braucht Root, um PID 1 zu signalisieren - laeuft
; deshalb ohne eigenes user= (Default: derselbe Benutzer wie supervisord).
command=python3 /app/docker/failfast-listener.py
events=PROCESS_STATE_FATAL
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
