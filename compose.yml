name: flashcards

services:
  app:
    build:
      context: .
      target: betrieb
    image: flashcards
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # Kein ports-Abschnitt, mit Absicht: Die Datenbank ist von aussen
    # nirgends erreichbar. Die Anwendung erreicht sie im Docker-Netz unter
    # "db". Fehlersuche: docker compose exec db psql -U flashcards

    volumes:
      - pgdata:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  pgdata:
