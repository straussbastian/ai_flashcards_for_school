name: Tests

# Bei jedem Push und jedem Pull Request.
on:
  push:
  pull_request:

# Nur Lesezugriff. Der Workflow schreibt nichts ins Repository zurueck.
permissions:
  contents: read

# Ein neuer Push auf denselben Zweig macht den vorherigen Lauf hinfaellig.
# Der Container-Build dauert Minuten; ueberholte Laeufe belegen sonst unnoetig
# einen Runner.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testsuite
    runs-on: ubuntu-latest
    # Grosszuegig: Der erste Lauf baut das Testabbild mit kaltem Docker-Cache,
    # und darin steckt ein vollstaendiger Chromium fuer die Browsertests.
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7.0.1

      # Der ganze Testlauf ist EIN Kommando. Auf dem Runner wird nichts
      # eingerichtet: kein Python, kein uv, kein PostgreSQL, kein Chromium,
      # kein createdb, keine .env. Das alles bringt compose.test.yml mit -
      # und zwar in genau der Zusammenstellung, die spaeter auch im Betrieb
      # laeuft (dasselbe Abbild, dasselbe PostgreSQL 17).
      #
      # --exit-code-from test: Der Rueckgabewert des Jobs ist der von pytest.
      # Ein roter Lauf ist ein roter Container ist ein roter Job.
      #
      # --abort-on-container-exit: Sonst liefe der db-Dienst nach dem Ende
      # der Suite weiter und der Schritt haenge bis zum Jobtimeout.
      - name: Tests im Container
        run: |
          docker compose -f compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from test

      # Bei einem Fehlschlag sind die Logs des db-Dienstes das Erste, was
      # jemand sehen will - der Schritt oben zeigt nur die Ausgabe von pytest.
      - name: Logs bei Fehlschlag
        if: failure()
        run: docker compose -f compose.test.yml logs

      - name: Abraeumen
        if: always()
        run: docker compose -f compose.test.yml down -v
