name: Tests und Deployment

# Bei jedem Push und jedem Pull Request.
on:
  push:
  pull_request:

# Nur Lesezugriff. Der Workflow schreibt nichts ins Repository zurueck.
permissions:
  contents: read

# Ein neuer Push auf denselben Zweig macht den vorherigen Lauf hinfaellig.
# Der Container-Build dauert Minuten; ueberholte Laeufe belegen sonst unnoetig
# einen Runner.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testsuite
    runs-on: ubuntu-latest
    # Grosszuegig: Der erste Lauf baut das Testabbild mit kaltem Docker-Cache,
    # und darin steckt ein vollstaendiger Chromium fuer die Browsertests.
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7.0.1

      # Der ganze Testlauf ist EIN Kommando. Auf dem Runner wird nichts
      # eingerichtet: kein Python, kein uv, kein PostgreSQL, kein Chromium,
      # kein createdb, keine .env. Das alles bringt compose.test.yml mit -
      # und zwar in genau der Zusammenstellung, die spaeter auch im Betrieb
      # laeuft (dasselbe Abbild, dasselbe PostgreSQL 17).
      #
      # --exit-code-from test: Der Rueckgabewert des Jobs ist der von pytest.
      # Ein roter Lauf ist ein roter Container ist ein roter Job.
      #
      # --abort-on-container-exit: Sonst liefe der db-Dienst nach dem Ende
      # der Suite weiter und der Schritt haenge bis zum Jobtimeout.
      - name: Tests im Container
        run: |
          docker compose -f compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from test

      # Bei einem Fehlschlag sind die Logs des db-Dienstes das Erste, was
      # jemand sehen will - der Schritt oben zeigt nur die Ausgabe von pytest.
      - name: Logs bei Fehlschlag
        if: failure()
        run: docker compose -f compose.test.yml logs

      - name: Abraeumen
        if: always()
        run: docker compose -f compose.test.yml down -v

  # ==========================================================================
  # Erst wenn die Suite gruen ist, wird ausgerollt.
  # ==========================================================================
  #
  # Der Anlass fuer diesen Job: In Coolify war das automatische Deployment bei
  # jedem Push auf main eingeschaltet. Coolify sieht die Testlaeufe von GitHub
  # aber nicht - es rollte also auch aus, wenn die Suite gerade rot wurde. Die
  # Reihenfolge kehrt sich hier um: GitHub testet, und nur ein gruener Lauf
  # stoesst das Deployment an.
  #
  # WICHTIG, sonst wirkt dieser Job nicht: Das automatische Deployment muss in
  # Coolify AUSGESCHALTET bleiben (Automatic Deployment / "Auto Deploy" aus).
  # Sonst deployt Coolify beim Push weiterhin selbst, parallel zu diesem Job
  # und ohne auf die Tests zu warten.
  deploy:
    name: Deployment anstossen
    # needs macht die ganze Sache: Ist der Job "tests" rot, laeuft dieser hier
    # gar nicht erst an.
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Nur der Zweig main, und nur ein echter Push. Ohne die zweite Bedingung
    # wuerde auch ein Pull Request gegen main deployen - also fremder Code,
    # bevor ihn jemand gesehen hat.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Fehlt ein Secret, soll das hier stehen und nicht als kryptischer
      # curl-Fehler drei Zeilen spaeter.
      - name: Sind die Zugangsdaten hinterlegt?
        run: |
          fehlt=0
          if [ -z "${{ secrets.COOLIFY_AUTH_TOKEN }}" ]; then
            echo "COOLIFY_AUTH_TOKEN ist nicht gesetzt."
            echo "In Coolify unter 'Keys & Tokens' einen API-Token anlegen und"
            echo "hier hinterlegen:  gh secret set COOLIFY_AUTH_TOKEN"
            fehlt=1
          fi
          if [ -z "${{ secrets.COOLIFY_WEBHOOK_URL }}" ]; then
            echo "COOLIFY_WEBHOOK_URL ist nicht gesetzt."
            echo "Das ist die Deploy-Adresse der Anwendung, zum Beispiel"
            echo "  https://vps.wus.services/api/v1/deploy?uuid=DEINE-UUID"
            echo "ohne den Parameter force - den haengt der naechste Schritt an."
            echo "Hinterlegen mit:  gh secret set COOLIFY_WEBHOOK_URL"
            fehlt=1
          fi
          [ "$fehlt" = "0" ] || exit 1

      - name: Coolify anstossen
        env:
          # Ueber die Umgebung und nicht direkt in die Kommandozeile: Sonst
          # stuende der Token im Klartext in der Prozessliste des Runners.
          URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_AUTH_TOKEN }}
        run: |
          # force=false: Coolify baut nur, was sich geaendert hat, und nutzt
          # seinen Docker-Cache.
          #
          # Angehaengt wird der Parameter nur, wenn er nicht schon dasteht.
          # Coolify zeigt die Deploy-Adresse je nach Stelle mit oder ohne ihn
          # an, und wer sie mit einfuegt, bekaeme sonst ein doppeltes
          # "force=false" in der Adresse.
          case "$URL" in
            *force=*) ziel="$URL" ;;
            *)        ziel="$URL&force=false" ;;
          esac

          code=$(curl -sS -o antwort.txt -w '%{http_code}' \
                   -X POST "$ziel" \
                   -H "Authorization: Bearer $TOKEN")

          echo "Antwort von Coolify (HTTP $code):"
          cat antwort.txt
          echo

          # Bewusst der Statuscode und nicht der Antworttext: Eine Pruefung auf
          # Formulierungen wie "deployment queued" haengt daran, wie Coolify
          # gerade formuliert. Aendert sich das, meldete dieser Schritt einen
          # Fehlschlag, obwohl das Deployment lief - oder, schlimmer, uebersaehe
          # einen echten.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Coolify hat den Deploy-Anstoss nicht angenommen (HTTP $code)."
            exit 1
          fi

          # Nur zur Nachverfolgung im Protokoll - es haengt nichts daran.
          uuid=$(grep -o '"deployment_uuid":"[^"]*"' antwort.txt | cut -d'"' -f4 || true)
          [ -n "$uuid" ] && echo "Deployment-UUID: $uuid"

          echo "Deployment angestossen. Der Fortschritt steht in Coolify."

  # ==========================================================================
  # Ebenfalls nur nach gruener Suite: das fertige Abbild veroeffentlichen.
  # ==========================================================================
  #
  # Der Anlass: Wer den Verbund auf einem eigenen Server betreiben will, soll
  # ihn nicht bauen muessen. compose.server.yml zieht genau dieses Abbild, und
  # damit laesst sich der Verbund aus einer einzigen Datei starten - ohne
  # Checkout, ohne Buildumgebung, ohne Coolify.
  #
  # WICHTIG, einmalig von Hand: GitHub legt ein neues Paket privat an, auch in
  # einem oeffentlichen Repository (Sichtbarkeit wird nicht vererbt, Zugriff
  # schon). Nach dem ersten Lauf muss das Paket unter
  # Repository -> Packages -> Package settings -> Change visibility auf
  # "public" gestellt werden. Sonst laeuft "docker compose up" auf einem
  # fremden Server in "denied: denied".
  abbild:
    name: Abbild veroeffentlichen
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Der Workflow ist oben auf contents: read gesetzt. Nur dieser Job darf
    # zusaetzlich schreiben, und nur in die Registry.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7.0.1

      - name: An ghcr.io anmelden
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Kein eigenes Secret noetig: Das Token des Laufs reicht, weil
          # packages: write oben gesetzt ist.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4.3.0

      # Gebaut wird die Stufe "betrieb" - dieselbe, die compose.yml baut. Die
      # Teststufe bleibt draussen: kein pytest, kein Chromium im Abbild, das
      # auf einem Schulserver laeuft.
      #
      # Nur linux/amd64. Das deckt Hostinger und die x86-Server bei Hetzner
      # ab. Fuer Hetzners ARM-Server (CAX) waere hier
      # platforms: linux/amd64,linux/arm64 einzutragen - das baut dann unter
      # Emulation und dauert deutlich laenger.
      - name: Bauen und hochladen
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          target: betrieb
          platforms: linux/amd64
          push: true
          # :main ist der bewegliche Zeiger, den compose.server.yml
          # standardmaessig zieht; der Commit-Hash bleibt als fester Stand
          # daneben stehen, damit man gezielt zurueck kann.
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
