[project]
name = "flashcards"
version = "0.1.0"
description = "Flashcards und Fragelisten fuer die Berufsschule"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    # Das offizielle MCP-SDK. Erst ab 2.x heisst die Klasse MCPServer
    # (mcp.server.mcpserver) und liefert streamable_http_app() eine
    # Starlette-App, die sich als ASGI-Anwendung einhaengen laesst. Die
    # Untergrenze 2.2 kommt aus der Sicherheit: 2.1.x sammelt in der
    # StreamableHTTP-Transportschicht Sitzungen unbegrenzt an
    # (GHSA-84m7-p3x7-pcfv). Obergrenze 3: Ein Hauptversionssprung hat dieses
    # SDK bereits einmal komplett umbenannt (mcp.server.fastmcp wirft heute
    # einen ModuleNotFoundError mit Migrationshinweis) - das soll die CI
    # melden und nicht der Betrieb.
    "mcp>=2.2,<3",
    "nh3>=0.2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx2>=2.12.0",
    # Nur fuer die Browsertests unter tests/browser. Der Browser selbst
    # kommt nicht ueber pip: "uv run playwright install chromium" laedt ihn
    # einmalig herunter (siehe README).
    "playwright>=1.55",
]

# Untergrenzen fuer Pakete, die nur mittelbar ins Abbild kommen (ueber mcp
# bzw. alembic). Sie gelten nur beim Aufloesen von uv.lock und machen die
# Pakete nicht zu eigenen Abhaengigkeiten. Sie verhindern, dass ein spaeteres
# "uv lock" auf eine Version mit bekannter Luecke zurueckfaellt. Die Zahlen
# stammen aus dem Coolify-Schwachstellenscan vom 18.11.2026.
[tool.uv]
constraint-dependencies = [
    "pyjwt>=2.15",                # u. a. GHSA-ffc3-869f-jxw9 (kritisch), GHSA-42vr-xj54-vc7v
    "opentelemetry-api>=1.45.2",  # GHSA-mf5v-w3w3-f6cg, GHSA-xcq7-p3pf-p88h
    "mako>=1.4.2",                # GHSA-5639-2j2p-m4mx
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Die Browsertests brauchen zweierlei, was ein frischer Checkout nicht hat:
# einen installierten Chromium und einen laufenden Uvicorn. Deshalb sind sie
# markiert und werden standardmaessig NICHT AUSGEWAEHLT (deselected), nicht
# uebersprungen (skipped). Der Unterschied ist Absicht:
#
#   - Ein Skip wuerde die Projektregel "0 uebersprungen" brechen, und der
#     Naechste, der sie prueft, hielte das fuer einen Rueckschritt.
#   - Ein harter Fehlschlag machte jeden frischen Checkout rot, bevor
#     ueberhaupt jemand den Browser installiert hat.
#
# Ein gewoehnlicher "pytest"-Lauf zaehlt sie also als deselected. Wer sie
# will, ruft sie ausdruecklich: "pytest -m browser" - das -m von der
# Kommandozeile ueberschreibt das hier stehende. Die CI macht genau das,
# nachdem sie Chromium installiert hat (.github/workflows/tests.yml).
addopts = "-m 'not browser'"
markers = [
    "browser: Browsertest gegen einen echten Chromium (siehe tests/browser/)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
